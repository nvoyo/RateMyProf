services:
  postgres:
    image: postgres:16-alpine
    container_name: rmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmp_password}
      POSTGRES_DB: ${POSTGRES_DB:-rmp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmp} -d ${POSTGRES_DB:-rmp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rmp_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - rmp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rmp_pgdata:
  rmp_redisdata:
