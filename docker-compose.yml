services:
  mysql:
    image: mysql:8.4
    container_name: rmp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rmp_root_password}
      MYSQL_USER: ${MYSQL_USER:-rmp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rmp_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rmp}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - rmp_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-rmp}", "-p${MYSQL_PASSWORD:-rmp_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rmp_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - rmp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rmp_mysqldata:
  rmp_redisdata:
